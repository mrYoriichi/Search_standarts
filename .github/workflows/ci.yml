# CI: linter + format + tests on every push/PR to main.
# The full requirements.txt is installed: tests import parser.py, which pulls
# docling/torch at module level. The pip cache softens it (first run ~10 min,
# faster after). Speedup (lazy docling import) — with the root cleanup.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests
        run: pytest

  # A separate job: frontend errors show up right away instead of waiting
  # for the 10-minute python dependency install.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint . --max-warnings 0

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
