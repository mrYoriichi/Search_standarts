# CI: линтер + формат + тесты на каждый push/PR в main.
# Ставим полный requirements.txt: тесты импортируют parser.py, который тянет
# docling/torch на уровне модуля. Кеш pip смягчает (первый прогон ~10 мин,
# дальше быстрее). Ускорение (ленивый импорт docling) — при разборе корня.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests
        run: pytest

  # Отдельный job: фронтенд-ошибки видны сразу, не ждут 10-минутной установки
  # python-зависимостей.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint . --max-warnings 0

      - name: Build
        run: npm run build
